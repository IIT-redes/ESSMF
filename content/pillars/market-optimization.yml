feature_matrix_intro: 'OneNet D11.2 retains three optimisation features: methodology, the strategy connecting sub-market clearings,
  and the clearing objective.'
feature_matrix:
- feature: Market optimisation methodology
  subfeature: Methodology
  options: Centralised; decentralised; distributed
  meaning: Defines the organisational form of optimisation across system levels and system operators.
- feature: Sub-markets optimisation strategy
  subfeature: Relationship between clearings
  options: Simultaneous; sequential; independent
  meaning: Defines whether related sub-markets are solved jointly, one after another, or in parallel without sharing resources.
- feature: (Sub-)market optimisation objective
  subfeature: Clearing objective
  options: Cost minimisation; social-welfare maximisation; reducing counter-activations; other
  meaning: States what the clearing process is explicitly trying to optimise.
design_intelligence_intro: OneNet links optimisation choices to information-sharing requirements, implementation complexity,
  overall efficiency and the risk of counter-actions or double procurement.
design_intelligence:
- title: Centralised and decentralised designs solve different coordination problems
  text: Centralised optimisation can embed TSO–DSO coordination inside one clearing problem but increases grid-data and information-sharing
    requirements. Decentralised designs use separate optimisation problems and therefore need explicit coordination rules.
  source: Troncia et al. (2023), §2.3 and §4.3
- title: Sequence changes economic outcomes
  text: Sequential local-first clearing can protect local constraints and reduce information exchange, but the OneNet analysis
    notes that it may lead to a sub-optimal result from the perspective of the overall power system.
  source: Troncia et al. (2023), §4.3
- title: The strategy must address counter-actions and double procurement
  text: If one market action creates a need for an expensive countermeasure elsewhere, the clearing architecture is not neutral.
    OneNet uses optimisation strategy and coordination rules to expose and mitigate this issue.
  source: Troncia et al. (2023), §4.3
- title: Objective functions must be explicit
  text: The TMF distinguishes cost minimisation, social-welfare maximisation and reduction of counter-activations because
    two architectures with similar timing and products can behave differently if they optimise different objectives.
  source: OneNet D11.2, Fig. 5.4; Troncia et al. (2023), §2.3
mapping_checklist:
- Is it possible to identify whether the clearing is centralised, decentralised or distributed?
- For every coupled pair of sub-markets, is the relationship simultaneous, sequential or independent?
- Is the optimisation objective explicit and distinguishable from technical feasibility constraints?
- Does the chosen architecture require grid/network information that the involved actors can realistically exchange?
- How are counter-activations, double procurement and system-wide inefficiency detected or prevented?
