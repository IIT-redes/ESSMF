- dim: Activation mode
  dtype: Categorical
  definition: How curtailment is physically or operationally implemented.
  options: SO-controlled · Local automation · Customer self-dispatch · Other
  read: Record the control mode and responsible actor.
  sources:
  - label: CEER 2023, forms of alternative connections
