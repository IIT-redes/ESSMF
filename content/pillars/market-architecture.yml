eyebrow: The structure of exchange
title: Market architecture
subtitle: 'Defines the market structure: sub-markets, timing, products, location and actor roles.'
philosophy: 'Describes the market as interacting sub-markets: what exists, when it operates, what it trades, where
  it applies, and who participates.'
flowchart_caption: 'Theoretical Market Framework taxonomy for market architecture: sub-markets, services/products,
  location and actors.'
tutorial_intro: 'Start here: these choices define the market objects that the other pillars coordinate, clear, operate,
  and constrain.'
tutorial_sections:
- title: 1. Define each sub-market
  text: List the sub-markets and record GOT, GCT, MTU and market type.
  items:
  - Use one consistent market label across all five pillar tables.
  - Keep timing values explicit enough to compare interacting markets.
- title: 2. Define service and product
  text: Separate the system service from the tradable product used to procure it.
  items:
  - Record product type and technical requirements.
  - Do not use service and product as synonyms.
- title: 3. Define location and roles
  text: Record spatial granularity, responsible SO, voltage level, buyer, seller and market operator.
  items:
  - State eligible technologies and aggregation rules.
  - Record whether participation is optional, compulsory or hybrid.
- title: 4. Check interoperability
  text: Use timing, location, product and actor choices to identify barriers to participation or coordination.
  items:
  - Look for timing or granularity mismatches.
  - Check whether roles remain clear when resources join several markets.
feature_matrix_intro: Use the table as a compact terminology reference and data-entry guide.
feature_matrix:
- feature: Sub-markets
  subfeature: Number of sub-markets
  datatype: Integer
  definition: Count of distinct exchange/clearing spaces in the architecture.
  meaning: Enter number of separate sub-markets.
- feature: Sub-markets
  subfeature: Gate Opening Time (GOT)
  datatype: Time / relative time
  definition: When the gate for submitting market bids or offers opens.
  meaning: Record opening point for each sub-market.
- feature: Sub-markets
  subfeature: Gate Closure Time (GCT)
  datatype: Time / relative time
  definition: When the gate for submitting or updating bids closes.
  meaning: Use it to compare timing compatibility across markets.
- feature: Sub-markets
  subfeature: Market Time Unit (MTU)
  datatype: Duration (e.g. 15 min, 1 h)
  definition: Time granularity of the traded market interval/product.
  meaning: Record interval used by the market.
- feature: Sub-markets
  subfeature: Sub-market type
  datatype: 'Categorical: bilateral / auction / exchange'
  definition: Market-based arrangement used to acquire flexibility.
  meaning: Choose clearing/trading arrangement.
- feature: Service(s)
  subfeature: Service
  datatype: Categorical / list
  definition: System need or action for which flexibility is procured, such as congestion management or voltage
    control.
  meaning: State system need, not the traded product.
- feature: Product(s)
  subfeature: Type of product
  datatype: Categorical / list
  definition: Form of the exchanged product, including availability and/or activation of active or reactive power.
  meaning: Describe what is actually traded.
- feature: Product(s)
  subfeature: Technical requirements
  datatype: Text / list
  definition: Technical properties required for the product and service, such as ramping or response capability.
  meaning: List the relevant technical conditions.
- feature: Location
  subfeature: Level of spatial granularity
  datatype: 'Categorical: area / feeder / node'
  definition: Spatial resolution at which flexibility is located or procured.
  meaning: Record both granularity and whether it is at transmission or distribution level.
- feature: Location
  subfeature: Responsible System Operator
  datatype: 'Categorical: TSO / DSO'
  definition: System operator responsible for the sub-market or system need.
  meaning: Identify responsible SO.
- feature: Location
  subfeature: Voltage level where resources are located
  datatype: Categorical / text
  definition: Grid voltage level of eligible resources.
  meaning: Record relevant voltage class(es).
- feature: Market roles and actors
  subfeature: Who is the buyer(s)
  datatype: Actor / role
  definition: Actor procuring the service or product.
  meaning: Identify buyer for each sub-market.
- feature: Market roles and actors
  subfeature: Who is the seller(s)
  datatype: Actor / role
  definition: Service-providing unit, group or other eligible seller of flexibility.
  meaning: Identify selling side.
- feature: Market roles and actors
  subfeature: Allowed technologies
  datatype: 'Multi-select: generators / loads / storage'
  definition: Resource classes eligible to participate.
  meaning: Select all eligible technology classes.
- feature: Market roles and actors
  subfeature: Aggregation method
  datatype: Categorical / text
  definition: Rule used to group individual resources, e.g. by area, voltage level or substation.
  meaning: State how resources may be aggregated.
- feature: Market roles and actors
  subfeature: Aggregation mix allowed
  datatype: Categorical / text
  definition: Rule defining which resource or bid types may be combined in one aggregation.
  meaning: State permitted combinations and restrictions.
- feature: Market roles and actors
  subfeature: Who is the MO
  datatype: Actor / role
  definition: Actor responsible for operating and clearing the sub-market.
  meaning: Identify market operator.
- feature: Market roles and actors
  subfeature: Participation in sub-market
  datatype: 'Categorical: optional / compulsory / hybrid'
  definition: Rule defining whether eligible providers choose, must, or partly must participate.
  meaning: Record participation regime.
