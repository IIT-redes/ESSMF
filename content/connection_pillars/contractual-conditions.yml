title: Contractual conditions
subtitle: For how long, and at what cost, does the customer connect?
color: '#6C4ACB'
image: ../assets/connection-f2.webp
philosophy: 'This pillar fixes the contractual envelope of non-firm access: duration,
  predictable curtailment windows, connection costs, allocation rules, maximum curtailment
  and network charges.'
tutorial_intro: Translate the flexible right into contract terms that users can price,
  compare and monitor over time.
tutorial_sections:
- title: 1. Set duration and conversion expectations
  text: Record whether the flexible status is temporary or permanent and, where relevant,
    the pathway to firm capacity.
- title: 2. Define ex-ante curtailment conditions
  text: State whether likely curtailment periods are pre-defined and how limited network
    capacity is allocated across users.
- title: 3. Make cost and risk limits explicit
  text: Separate one-off connection costs from recurring network charges and cap curtailment
    in measurable terms where applicable.
table_intro: The contract should make the access risk legible before operation begins.
  Use one row per design decision and keep connection costs separate from ongoing
  network charges.
rows:
