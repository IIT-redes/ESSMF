question: Do these contractual dimensions make the duration, curtailment exposure
  and cost allocation of a flexible connection sufficiently clear for users and system
  operators?
prompts:
- Do the options for pre-definition of curtailment (peak/off-peak, seasonality, none)
  cover how curtailment can be pre-defined?
- Should maximum curtailment be considered a contractual condition or an operational
  characteristic of the connection?
- Does the pillar make the difference between “Connection costs” and “Network charges”
  clear enough?
- Do the curtailment allocation options (pro-rata, LIFO, auction, proportional to
  congestion created) reflect how curtailment is shared among users in practice?
giscus: FCA Pillar 2 — Contractual conditions
key_terms:
- term: Temporary flexible connection
  definition: A non-firm arrangement used for a limited period, often until reinforcement
    or full firm capacity becomes available.
- term: Permanent flexible connection
  definition: A continuing flexible arrangement used where network development is
    not the efficient solution.
- term: Pre-defined curtailment
  definition: Curtailment periods or conditions that are specified in advance, for
    example by peak/off-peak blocks or seasonality.
- term: Connection cost
  definition: The one-off cost allocation associated with connecting the user or reinforcing
    the network for the requested capacity.
- term: Network charge
  definition: The tariff treatment applied to use of firm and flexible network capacity;
    it is distinct from the connection cost.
- term: Maximum curtailment
  definition: The contractual ceiling on curtailment exposure, expressed through duration,
    capacity, energy or monetary limits.
