question: Does this pillar clearly distinguish why flexible access is offered, the
  grid condition that makes it necessary, and who is eligible to use it?
prompts:
- Does the pillar clearly separate the SO's reason for offering a flexible connection
  (the benefit) from the technical cause that makes it necessary (the connection criteria)?
- After reviewing this pillar, is it clear why an SO would choose a Flexible Connection
  Agreement instead of reinforcement, local markets or other flexibility mechanisms
  and under what conditions?
- Are the network connection criteria (capacity, voltage level, short-circuit power,
  thermal limits, security criteria) clearly distinct from each other, or do some
  of them overlap?
- Is the distinction between new connections and capacity increases for existing users
  clear and useful in this pillar?
giscus: FCA Pillar 1 — Rationale and eligibility
key_terms:
- term: Firm connection / firm capacity
  definition: The part of network access that the user can rely on without the flexible
    restriction being activated.
- term: Flexible / non-firm access
  definition: Additional or alternative access that is subject to agreed limits or
    control of injection and/or withdrawal.
- term: Hosting capacity
  definition: The network capability available to accommodate new or increased injection
    or withdrawal without breaching operational limits.
- term: Eligible customer
  definition: A user or asset category that the framework allows to enter a flexible
    connection agreement, such as generation, demand or storage.
- term: Network connection criterion
  definition: The technical condition that prevents the requested firm connection,
    such as capacity, voltage, thermal, short-circuit or security limits.
