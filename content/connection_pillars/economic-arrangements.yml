question: Does this pillar make the allocation of curtailment value, market opportunity
  and financial responsibility sufficiently clear to prevent conflicting incentives?
prompts:
- Are compensation mechanisms, value stacking opportunities and imbalance responsibility
  independent dimensions or should some of them be merged?
- Does the pillar adequately capture how risks and rewards are distributed between
  the customer and the SO?
- Does this pillar make it possible to identify situations where double charging or
  double compensation may occur?
- Do the compensation options (fixed, set by the local flexibility market, local-market
  indexed, none) cover all possible ways of compensating curtailed users?
giscus: FCA Pillar 4 — Economic arrangements
key_terms:
- term: Compensation
  definition: The payment rule, if any, that applies when the user is curtailed under
    the flexible connection.
- term: Value stacking
  definition: The ability to combine the flexible connection with other commercial
    arrangements, such as bilateral contracts or local flexibility markets, subject
    to compatibility rules.
- term: Non-compliance
  definition: A breach of the agreed flexible-connection limits or required control
    conditions.
- term: Balance Responsible Party (BRP)
  definition: The party financially responsible for the difference between physical
    energy and nominated energy within the imbalance settlement period.
- term: Imbalance responsibility
  definition: The rule assigning financial responsibility for imbalances created when
    curtailment changes the scheduled injection or withdrawal.
- term: Double compensation / double charging
  definition: A coordination risk where the same flexibility or curtailment effect
    is rewarded or charged more than once through overlapping mechanisms.
