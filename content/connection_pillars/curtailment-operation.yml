question: Do the trigger, notice and activation dimensions together describe the full
  operational sequence of a flexible connection curtailment?
prompts:
- Do event type triggering activation, curtailment notification and activation mode
  together describe the full sequence of a curtailment event (trigger, notice, execution)
  or is a step missing?
- Do the event types (emergency, maintenance, congestion) cover all the situations
  in which curtailment can be triggered?
- Is activation mode truly independent of notification time, given that automated
  schemes generally allow shorter notice periods?
- Do you think the pillar can capture how curtailment is performed, either as a partial
  power limitation or as a full disconnection?
giscus: FCA Pillar 3 — Curtailment activation and operation
key_terms:
- term: Curtailment trigger
  definition: The event or network condition that authorises activation of the flexible
    restriction, such as emergency, maintenance or congestion.
- term: Activation mode
  definition: How the curtailment instruction is physically implemented, for example
    by system-operator control, local automation or customer self-dispatch.
- term: Curtailment notification
  definition: How far in advance the user is informed that a curtailment event will
    occur.
- term: Real-time / near-real-time activation
  definition: Operational activation close to delivery, where notice and response
    occur within a short interval.
- term: Partial limitation vs. disconnection
  definition: Curtailment can reduce available power to an agreed level or, where
    the framework allows, remove access completely for the event.
