eyebrow: The clearing intelligence
title: Market optimization
subtitle: The Market Optimisation pillar describes how sub-markets are cleared, how clearing processes relate to each other,
  and what objective the optimisation pursues.
philosophy: This pillar turns market architecture and coordination rules into a clearing logic. OneNet distinguishes who performs
  optimisation across network levels, whether coupled sub-markets are cleared together or in sequence, and which objective
  governs the outcome. These choices change information needs, implementation complexity and the risk of economically sub-optimal
  or conflicting results.
flowchart_caption: 'The flowchart separates three questions: optimisation methodology, the strategy linking multiple sub-markets,
  and the clearing objective.'
tutorial_intro: Read this pillar only after the architecture and coordination rules are clear. It explains how the market
  turns bids and constraints into a selected set of transactions.
tutorial_sections:
- title: 1. Choose the optimisation methodology
  text: Centralised optimisation uses one algorithm across voltage levels and system operators. Decentralised optimisation
    uses separate algorithms for different system levels and therefore requires coordination. Distributed organisation is
    defined in the TMF as having no externally driven optimisation.
  items: []
- title: 2. Choose how coupled sub-markets are solved
  text: Simultaneous optimisation solves the relevant sub-markets jointly while sharing resources. Sequential optimisation
    clears one before the other. Independent optimisation clears markets in parallel without sharing resources, although some
    clearing constraints may still be shared.
  items: []
- title: 3. State the optimisation objective
  text: The TMF includes objectives such as cost minimisation, social-welfare maximisation and reduction of counter-activations.
    The 2023 paper defines welfare maximisation through the combined producer/FSP and buyer/SO surplus and notes that other
    operational objectives may also be used.
  items: []
- title: 4. Analyse the information and coordination burden
  text: OneNet links centralised designs to stronger grid representation and network-information exchange requirements. Decentralised/sequential
    arrangements may lower those requirements but can produce a sub-optimal result from the perspective of the overall system.
  items: []
- title: 5. Check for double procurement and counter-actions
  text: 'The optimisation strategy influences whether one market action creates an expensive countermeasure elsewhere and
    how double procurement is prevented. OneNet’s demonstrators use different solutions: common centralised clearing versus
    sequential local-first clearing with aggregation/forwarding rules.'
  items: []
terminology_intro: The repository below uses the optimisation terminology and option set formalised in the TMF and retained
  in OneNet D11.2.
terminology:
- term: Market optimisation methodology
  definition: The organisational approach used to optimise across related sub-markets and system levels. TMF options are centralised,
    decentralised and distributed.
  source: Troncia et al. (2023), §2.3 / OneNet D11.2 Fig. 5.4
- term: Centralised optimisation
  definition: One algorithm considers the relevant voltage levels and solves the system needs of all participating system
    operators in one optimisation.
  source: Troncia et al. (2023), §2.3
- term: Decentralised optimisation
  definition: Separate algorithms optimise different system levels, with at least one optimisation for transmission and one
    for distribution; coordination is therefore required between optimisation levels.
  source: Troncia et al. (2023), §2.3
- term: Distributed organisation
  definition: The TMF option in which there is no externally driven optimisation.
  source: Troncia et al. (2023), §2.3
- term: Sub-market optimisation strategy
  definition: The rule describing how a pair of sub-markets is optimised relative to each other. TMF options are simultaneous,
    sequential and independent.
  source: Troncia et al. (2023), §2.3
- term: Simultaneous optimisation
  definition: The relevant sub-markets are optimised at the same time while sharing resources.
  source: Troncia et al. (2023), §2.3
- term: Sequential optimisation
  definition: One sub-market is optimised before the other.
  source: Troncia et al. (2023), §2.3
- term: Independent optimisation
  definition: Markets are cleared in parallel rather than jointly and do not share resources/bids, although clearing constraints
    may be shared when needed.
  source: Troncia et al. (2023), §2.3
- term: Cost minimisation
  definition: A TMF clearing-objective option in which the optimisation seeks the least-cost procurement outcome under the
    modelled requirements and constraints.
  source: OneNet D11.2, Fig. 5.4
- term: Social-welfare maximisation
  definition: An objective that maximises the combined surplus of the producer/FSP side and the buyer/SO side.
  source: Troncia et al. (2023), §2.3
- term: Reduction of counter-activations
  definition: A TMF objective aimed at limiting actions in one market that must be offset by opposite or corrective actions
    in another market.
  source: Troncia et al. (2023), §2.3 / OneNet D11.2 Fig. 5.4
