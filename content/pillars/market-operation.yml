feature_matrix_intro: OneNet D11.2 describes operational aspects at sub-market level and explicitly adds Bid properties to
  the earlier TMF.
feature_matrix:
- feature: Remuneration scheme
  subfeature: Payment rule
  options: No remuneration; negotiated price; pay-as-bid; uniform pay-as-clear; non-uniform pay-as-clear (nodal pricing);
    cost-based remuneration
  meaning: Defines how successful participation is financially remunerated.
- feature: Remuneration of the product attribute
  subfeature: What is remunerated
  options: Availability; activation; availability + activation; for active, reactive or apparent power
  meaning: Separates reservation/availability payment from activation/energy payment and identifies the physical quantity
    concerned.
- feature: Market clearing type
  subfeature: Clearing mode
  options: Continuous; discrete
  meaning: States whether trades occur continuously while the market is open or through discrete clearing events.
- feature: Procurement frequency
  subfeature: How often the market runs
  options: Event-based on SO call; daily; weekly; monthly; other
  meaning: Describes repetition frequency and must not be confused with the GOT/GCT timing of a particular session.
- feature: Bid properties
  subfeature: Minimum bid size
  options: Record the minimum bid-size value
  meaning: Captures one important participation/compatibility threshold for bids.
- feature: Bid properties
  subfeature: Bid structure
  options: Simple; complex
  meaning: Records the high-level complexity of bids accepted in the sub-market.
design_intelligence_intro: The OneNet assessment treats operation choices as case-specific. Remuneration, availability/activation
  procurement, timing and clearing mode interact with liquidity, competition, information quality and participation barriers.
design_intelligence:
- title: Pricing rules cannot be assessed independently of market conditions
  text: OneNet demonstrators use both pay-as-bid and pay-as-clear. The assessment discusses competition, product homogeneity
    and locational differentiation as factors that affect the suitability of a pricing rule.
  source: OneNet D11.2, §6 pricing-scheme assessment
- title: Availability and activation solve different timing needs
  text: Reserving availability in advance can increase SO confidence that flexibility will be present, while procuring closer
    to delivery benefits from better information. The suitable arrangement is service- and context-dependent.
  source: Troncia et al. (2023), §4.4
- title: Procurement frequency is not gate timing
  text: Markets may run at the same frequency while having different closure times. Keeping this distinction explicit is necessary
    when assessing coordination and bid-forwarding compatibility.
  source: Troncia et al. (2023), §2.4
- title: Bid properties affect participation and interoperability
  text: D11.2 identifies minimum bid size and bid structure as operational features. Its bid-forwarding analysis shows that
    differences in minimum size or product structure can require aggregation or other processing before bids can move between
    markets.
  source: OneNet D11.2, §5.1.4 and §5.2
mapping_checklist:
- Can a reviewer identify exactly how accepted providers are paid?
- Is it explicit whether availability, activation or both are remunerated and for which power quantity?
- Is the market continuous or discrete, and how often is it run?
- Are minimum bid size and bid structure explicit enough to judge participation barriers and cross-market compatibility?
- Are operational choices being confused with separate processes such as prequalification or settlement, which the TMF treats
  elsewhere?
