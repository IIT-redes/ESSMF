editorial_status: approved
key: connection
file: flexibility-connection-agreement.html
hero:
  eyebrow: Conditional access under constrained network capacity
  title: Flexible connection agreement
  philosophy: A flexible connection defines how scarce capacity, operational limits, risk, and responsibility are
    shared.
  lead: Flexible connections can accelerate access when firm capacity is unavailable. The agreement must make access
    rights, curtailment, compensation, control, review, and the path to firm access clear.
  primary_button: Understand the agreement
  secondary_button: Challenge the proposal
sections:
  overview:
    eyebrow: Overview and orientation
    title: Connection flexibility changes the definition of network access
    text: A flexible connection uses controllable access conditions to connect demand, generation, or storage within
      a constrained network envelope.
  idea:
    eyebrow: Our proposal
    title: Review the agreement as a complete allocation of rights, control, and risk
    text: ''
  why:
    eyebrow: Why it matters
    title: The mechanism can unlock capacity quickly, but its hidden costs may emerge later
    text: Poor design can create unbankable curtailment, unequal treatment, market conflicts, or indefinite delay
      of reinforcement.
  who:
    eyebrow: Who is affected?
    title: A contract with system-wide consequences
    text: ''
    where_title: Queues, reinforcement delays, and constrained hosting capacity
    where_text: Most relevant where useful access can be offered before reinforcement and the constraint can be
      monitored and managed transparently.
  framework:
    eyebrow: Shared review structure
    title: Review dimensions
    text: Open a dimension to review its design choices and leave focused feedback.
