glossary:
- term: Market architecture
  definition: The whole mechanism through which electricity products are exchanged to operate a delimited power system. In
    the TMF it is represented as interacting sub-markets.
- term: Sub-market
  definition: A market operated by one market operator that is responsible for clearing that specific market according to
    a specific objective.
- term: Gate Opening Time (GOT)
  definition: The TMF temporal sub-feature that records the gate-opening time value for a sub-market; D11.2 adds GOT to make
    market timing more explicit.
- term: Gate Closure Time (GCT)
  definition: The instant after which submitting or updating bids is no longer permitted.
- term: Market Time Unit (MTU)
  definition: The period for which a market price is established; D11.2 also describes it as the minimum duration for which
    a sell or buy bid can be placed.
- term: Sub-market type
  definition: The market-based solution used to acquire flexibility, such as bilateral negotiation, auction or exchange market.
- term: Service
  definition: The action generally undertaken by the system operator to mitigate a technical scarcity that would otherwise
    undermine network operation or create stability risks.
- term: Product
  definition: The tradable unit acquired by the network operator from flexibility providers that gives the option to deliver
    a service when activated.
feature_matrix_intro: 'This matrix follows the updated Entire Market Architecture structure in OneNet D11.2, Figures 5.1–5.2.
  It is intended as a reading map: each row is a design choice that should be identifiable when describing an existing market
  or specifying a new one.'
feature_matrix:
- feature: Sub-markets
  subfeature: Number of sub-markets
  options: Record the number of distinct sub-markets
  meaning: Defines how many separate exchange/clearing spaces form the architecture.
- feature: Sub-markets
  subfeature: Gate Opening Time (GOT)
  options: Record the GOT value
  meaning: Makes the opening of each market session explicit in the temporal architecture.
- feature: Sub-markets
  subfeature: Gate Closure Time (GCT)
  options: Record the GCT value
  meaning: Makes the closing point of each market session explicit and allows timing compatibility across markets to be assessed.
- feature: Sub-markets
  subfeature: Market Time Unit (MTU)
  options: Record the MTU value
  meaning: Captures the time granularity of the traded market interval; D11.2 demonstrators use values such as 15 minutes
    or 1 hour.
- feature: Sub-markets
  subfeature: Sub-market type
  options: Bilateral negotiation; auction; exchange market
  meaning: Identifies the market-based solution through which flexibility is acquired.
- feature: Service(s)
  subfeature: Service
  options: Relevant system service(s), e.g. balancing, congestion management, voltage control; or service-agnostic
  meaning: Identifies the system need/action that motivates procurement.
- feature: Product(s)
  subfeature: Type of product
  options: Standardised; harmonised; specific; generalised product forms; availability and/or activation of active/reactive
    power
  meaning: Separates the tradable unit from the system service it may support.
- feature: Product(s)
  subfeature: Technical requirements
  options: List the technical properties defined for the exchanged product, e.g. ramping
  meaning: Records the technical conditions attached to the product for the service for which it is procured.
- feature: Location
  subfeature: Locational granularity
  options: Area, feeder, or node at transmission or distribution level
  meaning: Defines the spatial resolution at which flexibility is procured.
- feature: Location
  subfeature: Responsible SO / voltage level
  options: TSO or DSO; record voltage level of resources
  meaning: Connects the sub-market to the responsible system operator and the grid level of eligible resources.
- feature: Market roles and actors
  subfeature: Buyer(s), seller(s), market operator
  options: TSO, DSO, MO/IMO, aggregator, FSP as applicable
  meaning: Makes institutional responsibility and the sides of the transaction explicit.
- feature: Market roles and actors
  subfeature: Allowed technologies
  options: Generators; loads; storage
  meaning: States which resource classes may participate.
- feature: Market roles and actors
  subfeature: Aggregation method / aggregation mix allowed
  options: 'Method: none, area, voltage level, substation, other, not applicable; mix: technology-based, bid-based, other'
  meaning: Describes how individual resources may be grouped and what combinations are allowed.
- feature: Market roles and actors
  subfeature: Participation in sub-market
  options: Optional; compulsory; hybrid
  meaning: States whether eligible providers choose to participate, are obliged under defined conditions, or face a mixed
    regime.
design_intelligence_intro: The TMF does not treat these choices as independent checkboxes. The OneNet analysis highlights
  interactions among temporal scope, spatial scope, product harmonisation, liquidity, competition, and actor responsibilities.
design_intelligence:
- title: Temporal and spatial scope shape liquidity
  text: The OneNet analysis links larger market windows and broader procurement areas to a larger potential pool of FSPs,
    while stressing that no generally valid size exists; the design must fit the case.
  source: Troncia et al. (2023), §4.1
- title: Product harmonisation creates a design trade-off
  text: Standardised or harmonised products can improve interoperability, liquidity and competition, especially when the same
    product can serve several system needs. The source also warns that local technical needs may justify tailored features.
  source: Troncia et al. (2023), §4.1
- title: Actor boundaries matter when markets become interoperable
  text: When resources and products can move across markets, the architecture must make roles and responsibilities explicit
    to avoid inefficient or conflicting actions between system operators and market operators.
  source: Troncia et al. (2023), §4.1
- title: Use the pillar bottom-up
  text: The TMF application starts from buyer–seller interactions, defines sub-markets, describes each sub-market with the
    TMF features, then describes interactions and reconstructs the overall architecture.
  source: Troncia et al. (2023), §3
mapping_checklist:
- Can every sub-market be placed unambiguously on a common time axis using GOT, GCT and MTU?
- Can the system service be distinguished from the product used to procure it?
- Can an external reviewer identify the buyer, seller, market operator, responsible SO and eligible technologies without relying
  on local institutional knowledge?
- Is the spatial granularity explicit enough to compare the market with another jurisdiction?
- Are aggregation and participation rules explicit enough to judge interoperability and bid-forwarding potential?
