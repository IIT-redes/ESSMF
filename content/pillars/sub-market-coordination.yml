eyebrow: The logic of interaction
title: Sub-market coordination
subtitle: Defines how interacting sub-markets share flexibility and coordinate decisions.
philosophy: Describes how markets compete for or share the same flexibility resources, including priority, access,
  commitment, forwarding, and timing.
flowchart_caption: 'Theoretical Market Framework taxonomy for coordination: allocation of flexibility and timing
  of coordination.'
tutorial_intro: Use the same Market 1–4 labels and describe only the interactions that actually apply.
tutorial_sections:
- title: 1. Set access order
  text: Record whether the TSO or DSO has priority, exclusivity, or neither.
  items:
  - Use the rule that applies to the interacting markets.
- title: 2. Define commitment and access
  text: State bid selection is formal or conditional and whether the TSO can access DERs.
  items:
  - A conditional result remains provisional until later coordination.
- title: 3. Define bid forwarding
  text: Record whether eligible unused bids can move to another market.
  items:
  - Note any filtering, aggregation or processing needed before forwarding.
- title: 4. Place coordination in time
  text: State coordination occurs during prequalification, procurement, activation, measurement or settlement.
  items:
  - Use Additional Information for pairwise interaction details.
feature_matrix_intro: Use the table to define each coordination choice and the data expected.
feature_matrix:
- feature: Allocation principle of flexibility
  subfeature: System operators order
  datatype: 'Categorical: TSO/DSO priority, TSO/DSO exclusivity, none'
  definition: Rule determining which system operator gets first or exclusive access to shared flexibility.
  meaning: Select access order for the considered interaction.
- feature: Allocation principle of flexibility
  subfeature: TSO access to DERs
  datatype: Boolean / N/A
  definition: Whether the TSO can access distribution-connected flexibility in the arrangement.
  meaning: Record yes, no or not applicable.
- feature: Allocation principle of flexibility
  subfeature: Commitment to bid selection
  datatype: 'Categorical: formal / conditional / N/A'
  definition: Whether a first-stage bid selection is binding or remains provisional pending later coordination.
  meaning: Record commitment rule.
- feature: Allocation principle of flexibility
  subfeature: Forwarding of bids
  datatype: Boolean / N/A + note
  definition: Transfer of eligible unused bids from one market to another, possibly after processing.
  meaning: Record whether forwarding is allowed and describe any processing.
- feature: Timeframe for coordination
  subfeature: Market phase for coordination between submarkets
  datatype: 'Multi-select: prequalification / procurement / activation / measurement / settlement'
  definition: Market phase(s) in which coordination between the sub-markets occurs.
  meaning: Select all phases where coordination is applied.
