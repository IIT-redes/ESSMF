- dim: Curtailment notification
  dtype: Categorical / timeframe
  definition: How far in advance customers are informed that curtailment will occur.
  options: Scheduled · Day-ahead · Intraday · Real-time · Ex-post · Other
  read: Select the applicable notice period; if it depends on event type, describe
    the rule.
  sources:
  - label: ISGAN WG9, §3.2.1
    open: ../docs/materials/fca/isgan-flexibility-acquisition-mechanism-designs.pdf#page=13
