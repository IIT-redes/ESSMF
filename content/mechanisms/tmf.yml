pillars:
- id: market-architecture
  eyebrow: The structure of exchange
  title: Market architecture
  summary: Defines the sub-markets, timing, products, location and actor roles.
- id: sub-market-coordination
  eyebrow: The logic of interaction
  title: Sub-market coordination
  summary: Defines how interacting markets share flexibility and coordinate decisions.
- id: market-optimization
  eyebrow: The clearing intelligence
  title: Market optimization
  summary: Defines how markets are organised, cleared and optimised.
- id: market-operation
  eyebrow: The procedure of trust
  title: Market operation
  summary: Defines payment, clearing, procurement frequency and bid rules.
- id: network-representation
  eyebrow: The physics inside the market
  title: Network representation
  summary: Defines how network constraints are represented and when they enter the market process.
case_example:
  image: assets/case-example-market-structure.png
  image_alt: Illustrative case market architecture mapped from the Theoretical Market Framework tables
  image_caption: Worked architecture produced from the five filled framework tables.
  explanation_title: How to fill the tables and translate them into the figure
  explanation_intro: Keep the same Market 1–4 labels across all five tables. Record only known information; use
    Additional Information for assumptions, exceptions, and pairwise conditions.
  explanation_points:
  - '1. Pillar 1 defines each market: timing, product, location, and actors. Each market becomes a block.'
  - 2. Keep the same labels in Pillars 2–5 to describe coordination, clearing, operation, and network constraints.
  - 3. Use “Not applicable” where needed and record uncertainty in Additional Information.
  - 4. Position blocks in time using GOT/GCT/MTU and by layer using buyer, operator, and location.
  - 5. Draw links only when coordination rules support them; use the remaining pillars to explain how the sessions
    work.
  downloads_title: Download the illustrative case
  downloads:
  - title: Case example — filled tables + figure
    description: Five filled framework tables plus the resulting market-architecture figure.
    file: docs/materials/case-example-filled-tables-and-figure.pdf
    label: Download case example PDF
  - title: Case example market-architecture figure
    description: Standalone architecture figure derived from the structured mapping.
    file: docs/materials/case-example-market-structure.png
    label: Download figure
  mapping_title: From table entries to the figure
  mapping_rows:
  - table_input: Pillar 1 — sub-markets + timing
    determines: Number of blocks and time position
    figure_output: Long-term, day-ahead/intraday and near-real-time placement
  - table_input: Pillar 1 — service/product + actors
    determines: Purpose and market layer
    figure_output: Meaning of each block and its buyer/system-operator layer
  - table_input: Pillar 2 — commitment/forwarding
    determines: How markets interact
    figure_output: Participation or bid-forwarding links
  - table_input: Pillars 3-4 — optimisation/operation
    determines: How each session clears and runs
    figure_output: Separate or coordinated market sessions
  - table_input: Pillar 5 — network representation
    determines: How grid feasibility enters
    figure_output: Local procurement-area and network-check interpretation
  source_note: Illustrative worked case only; it is not a definitive national-market representation.
