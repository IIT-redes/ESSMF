worksheet_text: For each market, record the optimisation method, clearing relationship, and objective.
eyebrow: The clearing intelligence
title: Market optimization
subtitle: Defines how related sub-markets are organised, solved and optimised.
philosophy: Describes where optimisation responsibility sits, how related clearings are linked, and what objective
  selects the outcome.
flowchart_caption: 'Theoretical Market Framework taxonomy for optimisation: methodology, clearing relationship and
  objective.'
tutorial_intro: Record the clearing logic for each market and its relationship with the others.
tutorial_sections:
- title: 1. Choose the optimisation methodology
  text: State optimisation is centralised, decentralised or distributed.
  items:
  - This describes where optimisation responsibility sits.
- title: 2. Define the clearing relationship
  text: State related sub-markets are solved simultaneously, sequentially or independently.
  items:
  - Use the same market labels as the other pillar tables.
- title: 3. State the objective
  text: Record clearing objective, such as cost minimisation, social-welfare maximisation or reduction of counter-activations.
  items:
  - Use Other only when the objective is clearly specified.
feature_matrix_intro: Use the table to define the optimisation choices and expected data.
feature_matrix:
- feature: Market optimisation
  subfeature: Optimisation methodology
  datatype: 'Categorical: centralised / decentralised / distributed'
  definition: Organisational approach used to optimise across related markets and system levels.
  meaning: Choose where optimisation responsibility is located.
- feature: Submarkets optimisation strategy
  subfeature: Relationship between clearings
  datatype: 'Categorical: simultaneous / sequential / independent'
  definition: Rule describing whether related sub-markets are solved together, one after another, or separately.
  meaning: Record relationship among clearings.
- feature: Sub-market clearing objective
  subfeature: Optimisation objective
  datatype: Categorical / text
  definition: Quantity the clearing process seeks to optimise, e.g. cost, social welfare or counter-activations.
  meaning: State objective used to select the result.
