  mapping_title: Table-to-figure translation at a glance
  mapping_rows:
  - table_input: Pillar 1 — Sub-markets + GOT/GCT/MTU
    determines: How many blocks exist and where they sit in time
    figure_output: LT, day-ahead/next-hour, intraday and near-real-time positions
  - table_input: Pillar 1 — Service + product
    determines: Purpose and traded flexibility attribute
    figure_output: Congestion-management markets with availability / activation logic
  - table_input: Pillar 1 — Location + actors
    determines: Who buys and at which grid layer
    figure_output: Local OneNet blocks placed in the DSO layer
  - table_input: Pillar 2 — Commitment + bid forwarding
    determines: How sub-markets can interact
    figure_output: Dashed participation-forwarding and solid bid-forwarding arrows
  - table_input: Pillar 3 — Optimisation
    determines: Relationship among clearing problems
    figure_output: Separate sequential market blocks rather than one joint clearing block
  - table_input: Pillar 4 — Operation
    determines: Auction/clearing/session characteristics
    figure_output: Operational interpretation of each local market session
  - table_input: Pillar 5 — Network representation
    determines: How locality and grid feasibility enter procurement
    figure_output: Distribution procurement-area interpretation of the DSO layer
  source_note: 'Source basis: OneNet D11.2, Section 5.1.6 (Spanish demonstrator), Figure 5.7 and Appendix Tables
    9.7–9.11; filled Spain tables supplied for this website review.'
