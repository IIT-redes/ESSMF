eyebrow: The physics inside the market
title: Network representation
subtitle: Defines how network constraints are represented and when they enter the market process.
philosophy: This pillar connects market decisions to grid physics. It records the level of network information used
  and the phase at which network constraints affect procurement or activation.
flowchart_caption: 'Theoretical Market Framework taxonomy for network representation: representation of constraints
  and timing of their inclusion.'
tutorial_intro: Use this pillar to state how physical feasibility is checked without hiding the data and modelling
  assumptions.
tutorial_sections:
- title: 1. Choose the representation
  text: State whether the market uses comprehensive grid data, partial grid data or empirical rules.
  items:
  - Describe any sensitivity or reduced-network representation in Additional Information.
- title: 2. Place constraints in the process
  text: 'Record when network constraints enter: procurement-area definition, prequalification, procurement, activation,
    measurement or settlement.'
  items:
  - Select all relevant phases.
- title: 3. Check feasibility and burden
  text: Balance physical fidelity with data, computation and information-sharing requirements.
  items:
  - State any validation or corrective step used with simplified models.
feature_matrix_intro: Use this table as both a terminology reference and a data-entry guide for Network Representation.
feature_matrix:
- feature: Representation of network constraints
  subfeature: Level/form of representation
  datatype: 'Categorical: comprehensive grid data / partial grid data / empirical rules'
  definition: Modelling approach used to account for physical network limits in the market design.
  meaning: Select the representation used and describe it if needed.
- feature: Timing of inclusion of network constraints
  subfeature: Market phase
  datatype: 'Multi-select: procurement areas / prequalification / procurement / activation / measurement / settlement'
  definition: Phase(s) at which network feasibility information influences the acquisition process.
  meaning: Select all phases where grid constraints are applied.
