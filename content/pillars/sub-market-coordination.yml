feature_matrix_intro: 'The updated OneNet coordination pillar describes pairwise interactions among sub-markets through two
  features: allocation principle of flexibility and timeframe for coordination.'
feature_matrix:
- feature: Allocation principle of flexibility
  subfeature: System operators order
  options: Priority for TSO; priority for DSO; exclusivity for TSO; exclusivity for DSO; no priority nor exclusivity
  meaning: Defines who has first or exclusive access to common flexibility when multiple system operators/sub-markets draw
    from the same resource pool.
- feature: Allocation principle of flexibility
  subfeature: Commitment to bid selection
  options: Formal; conditional
  meaning: States whether the first-stage selection is binding or provisional pending later coordination.
- feature: Allocation principle of flexibility
  subfeature: TSO access to DERs
  options: Yes; no; not applicable
  meaning: Makes explicit whether the TSO can access distribution-connected flexibility in the considered interaction.
- feature: Allocation principle of flexibility
  subfeature: Forwarding of bids
  options: Yes; no; not applicable
  meaning: Records whether eligible bids can be transferred from one sub-market to another.
- feature: Timeframe for coordination
  subfeature: Market phase for coordination
  options: Prequalification; procurement; activation; measurement; settlement
  meaning: Identifies the stage(s) of the market process where coordination between the two sub-markets occurs.
design_intelligence_intro: OneNet uses this pillar to reveal where shared resources, overlapping markets and sequencing rules
  can create either value stacking or conflicts.
design_intelligence:
- title: The allocation principle is pairwise, not a single market-wide label
  text: The TMF treats the allocation principle as a link between two sub-markets, especially when different system operators
    procure flexibility in overlapping time windows from the same pool of resources.
  source: Troncia et al. (2023), §2.2
- title: Bid forwarding can improve allocation and value stacking
  text: OneNet treats forwarding of unused eligible bids as a coordination mechanism between markets, but it requires compatibility
    checks and may need intermediate processing such as filtering or aggregation.
  source: OneNet D11.2, §2.2 and §5.2
- title: Coordination must also prevent gaming and conflicting activation
  text: The source highlights conflictive overlap, artificial congestion, double use and incompatible activations as risks
    when the same resources are available to multiple markets.
  source: Troncia et al. (2023), §4.2
- title: Harmonising market phases can reduce barriers
  text: Coordinating shared processes such as prequalification can reduce duplicated procedures and participation barriers,
    although dedicated procedures may still be needed for market-specific requirements.
  source: Troncia et al. (2023), §4.2; OneNet D11.2 harmonisation recommendations
mapping_checklist:
- For each pair of interacting sub-markets, is it clear whether one SO has priority, exclusivity, or neither?
- Is bid selection formal or conditional, and at what point does a provisional decision become binding?
- Can unused eligible bids move to another market, and what filtering/aggregation step is required before forwarding?
- At which market phases is coordination performed, and are any processes duplicated unnecessarily?
- Could the chosen sequence create double use, conflicting activation, artificial congestion or gaming incentives?
