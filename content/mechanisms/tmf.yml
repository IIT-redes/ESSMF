editorial_status: approved
hero:
  title: Electricity System Services Market
  statement: A changing grid needs a compass for its markets.
  lead: "A shared language for designing and comparing electricity-market frameworks across products,\n        \
    \  actors, timeframes, coordination layers, and network constraints. We warmly invite your expert feedback to\
    \ sharpen the framework for research, regulation, and implementation."
  primary_button: Explore the proposal
  secondary_button: Contribute feedback
sections:
  journey:
    eyebrow: The journey
    title: Four questions guide the discussion before the framework
    text: 'The following path introduces the proposal as a sequence of design questions: what is being exchanged,
      why coordination is needed, who is affected, and where the framework becomes implementable.'
  idea:
    eyebrow: What is the proposal?
    title: A market framework is not a diagram. It is a grammar for change.
    text: ''
  why:
    eyebrow: Why does it matter?
    title: Flexibility is a coordination problem before it becomes a market product.
    text: ''
  affected:
    eyebrow: Who needs a common language?
    title: The framework connects actors who often see only one part of the market
    text: ''
  where:
    eyebrow: Where can it be applied?
    title: From real markets to comparable design choices
    text: ''
  framework-view:
    eyebrow: The framework
    title: Five pillars for describing and designing flexibility markets
    text: Each pillar captures a set of choices. Together, they help move from isolated local solutions toward market
      designs that can be compared, assessed, and improved.
  review:
    eyebrow: Your contribution
    title: Help us make the framework sharper, not just more complete.
    text: ''
  final-feedback:
    eyebrow: Final feedback
    title: Overall comments and supporting material
    text: "After the pillar-by-pillar review, we warmly invite you to share any general comment, concern,\n    \
      \      reference, use case, implementation example, or supporting material that could help us improve\n  \
      \        the proposed framework as a whole."
  spain-example:
    eyebrow: Worked implementation example
    title: Spain case — from five filled TMF tables to one readable market architecture
    text: 'The Spanish demonstrator illustrates the intended workflow of the framework: experts first fill the five
      pillar tables using a common vocabulary; those entries are then translated into a single market-architecture
      view. The figure is therefore a visual synthesis of the structured tables, not a separate design exercise.'
pillars:
- id: market-architecture
  eyebrow: The structure of exchange
  title: Market architecture
  summary: Market architecture defines what is traded, where it is traded, which actors participate, and how individual
    sub-markets form one coordinated design space.
- id: sub-market-coordination
  eyebrow: The logic of interaction
  title: Sub-market coordination
  summary: Sub-market coordination defines how flexibility is allocated when several markets, buyers, or system
    needs compete for the same distributed resources.
- id: market-optimization
  eyebrow: The clearing intelligence
  title: Market optimization
  summary: Market optimization defines how bids, constraints, objectives, and sub-market interactions are transformed
    into a clearing result.
- id: market-operation
  eyebrow: The procedure of trust
  title: Market operation
  summary: 'Market operation defines the practical rules that make the market usable: remuneration, clearing type,
    procurement frequency, bid properties, and market phases.'
- id: network-representation
  eyebrow: The physics inside the market
  title: Network representation
  summary: Network representation defines how physical constraints, topology, voltage, congestion, and location
    are included in the market design.
spain_example:
  image: assets/spain-market-structure.png
  image_alt: Overview of the Market Architecture for the OneNet Spanish demonstrator
  image_caption: Figure 5.7 / Spain case. The lower DSO layer contains the four OneNet local sub-markets; the upper
    layer places the relevant existing day-ahead, intraday, balancing and TSO congestion-management markets in context.
    The horizontal axis orders markets from long-term to near-real-time.
  explanation_title: How the filled tables are translated into the market-structure figure
  explanation_intro: 'D11.2 uses the TMF to describe the Spanish demonstrator systematically. The transformation
    can be read as a seven-step mapping from table entries to visual elements:'
  explanation_points:
  - '1. Create the market blocks from Pillar 1. The Spanish architecture table identifies four DSO-side sub-markets:
    LT-D-P-A, LT-D-P-AE, ST-D-P-E and RT-D-P-E. Each becomes a separate block in the DSO layer.'
  - 2. Place the blocks on the time axis using GOT, GCT and MTU. The long-term markets open months/weeks ahead;
    ST-D-P-E operates day-ahead or next-hour; RT-D-P-E is positioned on the day of delivery / near-real-time. Those
    rows determine the left-to-right placement of the blocks.
  - 3. Place the blocks on the buyer/system-operator axis using the location and actor rows. The DSO is the buyer
    and responsible system operator; resources are connected at MV/LV and grouped in distribution-system areas.
    This is why the four OneNet sub-markets appear in the DSO layer rather than the TSO layer.
  - 4. Interpret each block using service and product rows. All four local sub-markets support congestion management,
    while the traded attribute changes from active-power availability, to availability + activation, to activation.
    The OneNet harmonised-product mapping distinguishes predictive long-term, predictive short-term and corrective
    products.
  - 5. Draw links using Pillar 2. The coordination table gives the DSO exclusive access to DERs in the demonstrator,
    defines conditional commitment from long-term availability markets into ST-D-P-E, and records the conceptual
    investigation of bid forwarding from ST-D-P-E toward the intraday energy market. These entries become the dashed
    participation-forwarding and solid bid-forwarding arrows in the figure.
  - 6. Read the sequencing from Pillars 3 and 4. The Spanish design is decentralised, sequential and cost-minimising;
    the local markets use pay-as-bid auctions, discrete clearing, event-based DSO procurement, 10 kW minimum bids
    and simple bid structures. These choices explain why the figure shows separate market sessions rather than one
    simultaneously co-optimised clearing box.
  - 7. Interpret the local nature through Pillar 5. Network constraints are represented with comprehensive/partial
    grid data and incorporated when procurement areas are defined and during procurement. This supports the local
    DSO procurement-area interpretation of the lower layer.
  - 'Important boundary of the example: the filled Spanish TMF tables describe the OneNet local DSO markets. D11.2
    then places existing day-ahead/intraday energy, balancing and TSO congestion-management markets above them to
    show the wider architecture. Their integration with the local short-term markets was an open task; the possible
    links were investigated conceptually rather than fully demonstrated.'
