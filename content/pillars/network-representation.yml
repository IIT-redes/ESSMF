feature_matrix_intro: 'The OneNet Network Representation pillar asks two questions only: how network constraints are represented,
  and at which market phase they are introduced.'
feature_matrix:
- feature: Representation of network constraints
  subfeature: Level/form of representation
  options: Comprehensive grid data; partial grid data; empirical rules
  meaning: Defines how much network physics/information is embedded in or around market clearing.
- feature: Timing of inclusion of network constraints
  subfeature: Market phase
  options: Definition of procurement areas; prequalification; procurement; activation; measurement; settlement
  meaning: Defines when network feasibility information influences the market process.
design_intelligence_intro: The OneNet/Troncia analysis frames network representation as a techno-economic trade-off between
  physical fidelity and the data, computation, information exchange and governance burden required to obtain it.
design_intelligence:
- title: Comprehensive grid data increases physical detail and information burden
  text: The peer-reviewed TMF explains comprehensive grid data as a representation of electrical grid properties that allows
    the optimisation to perform detailed power-flow calculations.
  source: Troncia et al. (2023), §2.5
- title: Partial grid data can use sensitivities and margins
  text: The TMF describes partial grid data as using the sensitivity of flexibility to critical voltage/current constraints
    and associated margins, avoiding a full network model in the market clearing.
  source: Troncia et al. (2023), §2.5
- title: Less complete representation can require corrective checks
  text: OneNet notes that representation comprehensiveness affects whether clearing results comply with grid constraints and
    therefore whether further corrective procedures are needed to ensure feasibility.
  source: Troncia et al. (2023), §4.5
- title: The timing of network inclusion is itself a design choice
  text: D11.2 allows network constraints to enter at procurement-area definition, prequalification, procurement, activation,
    measurement or settlement, meaning feasibility can be protected at several different points in the process.
  source: OneNet D11.2, Fig. 5.6
- title: Information governance is part of the trade-off
  text: The OneNet analysis connects grid-model detail with data availability, power-flow computation, data-exchange timing,
    cyber-security and privacy concerns among TSOs, DSOs and other stakeholders.
  source: Troncia et al. (2023), §4.5
mapping_checklist:
- Does the market use comprehensive grid data, partial grid data or empirical rules to protect network feasibility?
- Can the data actually be shared at the required time and with acceptable computational burden?
- At which market phases do network constraints influence eligibility, procurement, activation or verification?
- If the representation is simplified, what additional check or corrective action ensures that the final result is physically
  feasible?
- Is the network-representation choice consistent with the optimisation methodology and the information available to each
  system operator?
