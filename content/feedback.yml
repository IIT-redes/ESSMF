tmf_sections:
- key: marketArchitecture
  label: Market architecture
  form_url: '#'
  giscus_term: TMF Pillar 1 — Entire Market Architecture
  qna_term: TMF Pillar 1 — Entire Market Architecture
  poll_url: '#'
  poll_title: TMF Pillar 1 — Structured assessment
  qna_title: TMF Pillar 1 — Entire Market Architecture
  qna_prompt: Can this pillar describe an existing flexibility market unambiguously and guide a new distribution-level market?
  qna_prompts:
  - Are sub-market number, GOT, GCT, MTU and market type sufficient?
  - Are service, product and technical requirements clearly separated?
  - Are location, actor, eligibility and aggregation fields sufficient?
  - What is missing, ambiguous or too context-specific for cross-country comparison?
- key: subMarketCoordination
  label: Sub-market coordination
  form_url: '#'
  giscus_term: TMF Pillar 2 — Sub-market Coordination
  qna_term: TMF Pillar 2 — Sub-market Coordination
  poll_url: '#'
  poll_title: TMF Pillar 2 — Structured assessment
  qna_title: TMF Pillar 2 — Sub-market Coordination
  qna_prompt: Does this pillar capture how shared flexibility is allocated across interacting markets without double use or
    conflicting activation?
  qna_prompts:
  - Are priority/exclusivity and TSO access to DERs explicit enough?
  - Are formal/conditional commitment rules sufficient?
  - Is bid forwarding described with the required processing steps?
  - Are the relevant coordination phases complete?
- key: marketOptimization
  label: Market optimization
  form_url: '#'
  giscus_term: TMF Pillar 3 — Market Optimisation
  qna_term: TMF Pillar 3 — Market Optimisation
  poll_url: '#'
  poll_title: TMF Pillar 3 — Structured assessment
  qna_title: TMF Pillar 3 — Market Optimisation
  qna_prompt: Do these optimisation fields distinguish existing designs and guide a new coordinated distribution-level market?
  qna_prompts:
  - Is centralised/decentralised/distributed organisation clear enough?
  - Do simultaneous/sequential/independent choices capture the clearing relationship?
  - Is the optimisation objective explicit enough?
  - What information is still needed to understand responsibility and coordination?
- key: marketOperation
  label: Market operation
  form_url: '#'
  giscus_term: TMF Pillar 4 — Market Operation
  qna_term: TMF Pillar 4 — Market Operation
  poll_url: '#'
  poll_title: TMF Pillar 4 — Structured assessment
  qna_title: TMF Pillar 4 — Market Operation
  qna_prompt: Does this pillar contain the minimum information needed to compare and implement sub-market operation?
  qna_prompts:
  - Are remuneration options sufficient?
  - Is availability versus activation remuneration clear?
  - Do clearing type and procurement frequency capture operating logic?
  - Are minimum bid size and bid structure sufficient?
- key: networkRepresentation
  label: Network representation
  form_url: '#'
  giscus_term: TMF Pillar 5 — Network Representation
  qna_term: TMF Pillar 5 — Network Representation
  poll_url: '#'
  poll_title: TMF Pillar 5 — Structured assessment
  qna_title: TMF Pillar 5 — Network Representation
  qna_prompt: Does this pillar capture how and when network constraints enter the market so that results remain physically
    feasible?
  qna_prompts:
  - Are comprehensive grid data, partial grid data and empirical rules sufficient?
  - At which phases should network constraints enter?
  - What validation is needed when simplified representations are used?
  - What additional option is needed for practical DSO implementation?
