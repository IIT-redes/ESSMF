title: Network representation
subtitle: Defines how network constraints are represented and when they enter the market process.
philosophy: Connects market decisions to grid physics by stating how network constraints are represented and when
  they affect the process.
flowchart_caption: 'Theoretical Market Framework taxonomy for network representation: representation of constraints
  and timing of their inclusion.'
tutorial_intro: State how physical feasibility is checked and what network information is used.
tutorial_sections:
- title: 1. Choose the representation
  text: State the market uses comprehensive grid data, partial grid data or empirical rules.
  items:
  - Describe any sensitivity or reduced-network representation in Additional Information.
- title: 2. Place constraints in the process
  text: 'Record when network constraints enter: procurement-area definition, prequalification, procurement, activation,
    measurement or settlement.'
  items:
  - Select all relevant phases.
- title: 3. Check feasibility and burden
  text: Balance physical fidelity with data, computation and information-sharing requirements.
  items:
  - State any validation or corrective step used with simplified models.
