title: Rationale and eligibility
subtitle: Why is a flexible connection granted, and to whom?
color: '#0B5FA5'
image: ../assets/connection-f1.webp
philosophy: This pillar separates the reason for offering non-firm access from the
  technical condition that makes firm access unavailable, and identifies which customers
  may use the arrangement.
tutorial_intro: Start with the network need, then distinguish the system benefit,
  wider social value, eligible users and the technical connection criteria.
tutorial_sections:
- title: 1. Identify the system-operator rationale
  text: State whether the agreement avoids reinforcement, defers it, or provides an
    interim connection while committed reinforcement is delivered.
- title: 2. Separate benefits from technical causes
  text: Do not confuse the objective of the agreement with the physical constraint
    that prevents firm access.
- title: 3. Define who is eligible
  text: Record whether generation, demand, storage, new connections or capacity increases
    can receive the flexible offer.
table_intro: Use the table as a terminology and data-entry guide. The source column
  opens the supporting document at the relevant page and also provides the full PDF
