eyebrow: Flexible connection agreement · Pillar 3
title: Curtailment activation and operation
subtitle: When and how is curtailment triggered?
color: '#C25A00'
image: ../assets/connection-f4.webp
philosophy: 'This pillar governs the operational sequence of a curtailment event:
  what triggers it, who or what activates it, and how much notice the customer receives.'
tutorial_intro: 'Treat curtailment as an auditable sequence: trigger → notice → execution.
  The design should make each step observable and implementable.'
tutorial_sections:
- title: 1. Define triggering events
  text: State whether emergency, maintenance, congestion or another condition can
    activate the flexible limit.
- title: 2. Define activation mode
  text: Clarify whether the system operator controls the action, local automation
    executes it, or the customer self-dispatches.
- title: 3. Define notification timing
  text: Record the notice period and distinguish scheduled events from near-real-time
    or ex-post actions.
table_intro: Use these rows to reconstruct the full operating sequence and identify
  any missing step between detection of a network need and the actual limitation of
  access.
rows:
- dim: Event type triggering activation
  dtype: Categorical / multi-select
  definition: Circumstances under which the system operator activates curtailment.
  options: Emergency · Maintenance · Congestion · Other
  read: Select every event that can trigger curtailment.
  sources:
  - label: ISGAN WG9, §3.2.1
