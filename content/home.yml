editorial_status: approved
hero:
  eyebrow: DSO flexibility procurement at distribution level
  title: Flexibility acquisition mechanisms
  philosophy: Flexibility is not one market. It is a portfolio of choices on infrastructure, access, pricing, obligations,
    and procurement.
  lead: DSOs can combine rules, flexible connections, network tariffs, and market-based procurement, alongside reinforcement
    and DSO-owned resources.
  invitation: Review the framework, challenge the boundaries between mechanisms, and help turn it into a practical
    European reference.
  primary_button: Follow the decision road
  secondary_button: Choose a review environment
road_intro:
  eyebrow: The complete flexibility-acquisition landscape
  title: From a DSO network need to a justified mechanism portfolio
  text: Start from the network need, compare the available routes, then combine mechanisms only where their roles
    and interactions are clear.
road_turns:
- number: '01'
  kicker: Start
  title: A network need emerges
  text: Describe the need by location, timing, duration, severity, and certainty.
  href: ''
  selected: false
- number: '02'
  kicker: First comparison
  title: Reinforcement and DSO-owned resources
  text: Compare reinforcement, operational measures, DSO-owned resources, and third-party flexibility on cost, reliability,
    timing, and long-term value.
  href: ''
  selected: false
- number: '03'
  kicker: Administrative path
  title: Rules-based approach
  text: Use mandatory requirements only where justified; define the legal basis, proportionality, and user protection.
  href: ''
  selected: false
- number: '04'
  kicker: Selected deep dive - implicit signal
  title: Network tariff design
  text: Use tariffs to influence routine grid use. Their value depends on a clear network cost driver, customer
    response, and coordination with other price signals.
  href: pages/tariff-design.html
  selected: true
- number: '05'
  kicker: Selected deep dive - access condition
  title: Flexible connection agreement
  text: Use flexible access when firm capacity is constrained. Define access rights, curtailment, compensation,
    control, and the path to reinforcement.
  href: pages/flexibility-connection-agreement.html
  selected: true
- number: '06'
  kicker: Selected deep dive - explicit procurement
  title: Market-based procurement and local flexibility markets
  text: Use explicit procurement when a measurable service can be competitively bought. Success depends on liquidity,
    transparent rules, and compatibility with other markets.
  href: pages/theoretical-market-framework.html
  selected: true
- number: '07'
  kicker: Destination
  title: An integrated and practical portfolio
  text: Build a portfolio with clear boundaries, signal priority, protection against double charging or reward,
    and a defined role for reinforcement.
  href: ''
  selected: false
focus_intro:
  eyebrow: Why we selected three mechanisms for deeper research
  title: Three interfaces where regulation, system operation, and customer participation meet
  text: 'We focus on three interfaces: price signals, access conditions, and explicit service procurement.'
focus_cards:
- badge: Price
  title: Tariff design
  text: Implicit and preventive. Useful for recurring network needs, but sensitive to granularity, fairness, response,
    and interaction with explicit markets.
- badge: Access
  title: Flexible connection
  text: Contractual and locational. It can unlock capacity quickly, but requires clear curtailment rights, compensation,
    control, and a reinforcement pathway.
- badge: Service
  title: Local flexibility market
  text: Explicit and measurable. It can reveal flexibility value, but depends on products, liquidity, clearing,
    coordination, settlement, and network constraints.
interaction_callout:
  title: The research gap is often between the mechanisms
  text: A customer may face a tariff, a connection condition, and a local-market opportunity at the same time. The
    key questions are signal priority, baselines, double commitment, compensation, liquidity, and reinforcement.
mechanisms_intro:
  eyebrow: Three expert-review environments
  title: Choose a mechanism, examine its dimensions, and help shape the next research line
  text: Open a mechanism page, review its key dimensions, and leave focused feedback.
