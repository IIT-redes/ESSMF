eyebrow: The procedure of trust
title: Market operation
subtitle: 'The Market Operation pillar describes the operational rules of each sub-market: remuneration, the remunerated product
  attribute, clearing type, procurement frequency and the properties of accepted bids.'
philosophy: This pillar is where market design becomes a repeatable transaction process. It does not describe prequalification,
  baselining or settlement as separate pillar features; rather, the TMF pillar focuses on how bids are paid, what is paid,
  how the market is cleared, how often it runs and what bid forms are accepted. OneNet D11.2 explicitly adds Bid properties
  to the earlier framework.
flowchart_caption: 'The flowchart shows the operational option set used by the TMF: remuneration, remunerated attribute, clearing
  type, procurement frequency and bid properties.'
tutorial_intro: Use this pillar to translate the market concept into rules that participants can act on and market operators
  can implement consistently.
tutorial_sections:
- title: 1. Define the remuneration scheme
  text: The TMF distinguishes no remuneration, negotiated price, pay-as-bid, uniform pay-as-clear, non-uniform pay-as-clear/nodal
    pricing, and cost-based remuneration. The 2023 paper explains how these schemes differ in the price received by successful
    providers.
  items: []
- title: 2. Specify what product attribute is remunerated
  text: The framework records whether payment is for availability, activation, or both, and whether the remunerated quantity
    concerns active, reactive or apparent power. This is important when capacity is reserved ahead of delivery and activation
    is settled later.
  items: []
- title: 3. Choose continuous or discrete clearing
  text: In a continuous market, participants can trade while the market is open. In a discrete market, clearing takes place
    in scheduled batches at defined intervals. The choice must match the timing and operational purpose of the service.
  items: []
- title: 4. Define procurement frequency separately from market timing
  text: 'Procurement frequency records how often the sub-market runs. It is not the same as GOT/GCT: two markets can both
    run daily yet close at different times before delivery.'
  items: []
- title: 5. Define the admissible bid format
  text: D11.2 adds Bid properties to capture minimum bid size and bid structure. These features matter for participation barriers
    and compatibility with other markets, including bid-forwarding possibilities.
  items: []
- title: 6. Review the operational trade-offs highlighted by OneNet
  text: The OneNet analysis does not identify one universally superior remuneration, procurement timing or clearing type.
    Availability procurement can increase confidence and extend the procurement window, while near-delivery procurement may
    benefit from better system information. The appropriate choice remains service- and context-specific.
  items: []
terminology_intro: These definitions focus on the operational features that the TMF assigns to each individual sub-market.
  Market phases such as prequalification, activation, measurement and settlement are treated elsewhere in D11.2 and should
  not be confused with the pillar’s feature set.
terminology:
- term: Remuneration scheme
  definition: The rule used to determine payment for successful market participation. TMF options include no remuneration,
    negotiated price, pay-as-bid, uniform pay-as-clear, non-uniform pay-as-clear and cost-based remuneration.
  source: Troncia et al. (2023), §2.4 / OneNet D11.2 Fig. 5.5
- term: Negotiated price
  definition: A price agreed through bilateral negotiation between the relevant parties.
  source: Troncia et al. (2023), §2.4
- term: Pay-as-bid
  definition: A discriminatory-price auction in which each successful seller is paid the price requested in its accepted bid.
  source: Troncia et al. (2023), §2.4
- term: Uniform pay-as-clear
  definition: A uniform-price auction in which successful sellers receive the same per-unit clearing price for the homogeneous
    good or service.
  source: Troncia et al. (2023), §2.4
- term: Non-uniform pay-as-clear / nodal pricing
  definition: A clearing approach with different prices at different grid nodes, reflecting locational value including congestion
    and delivery effects.
  source: Troncia et al. (2023), §2.4
- term: Cost-based remuneration
  definition: Payment based on a price or price curve set by the system operator for buying the service, potentially with
    an agreed quantity.
  source: Troncia et al. (2023), §2.4
- term: Remunerated product attribute
  definition: 'The product component for which payment is made: availability, activation, or both; D11.2 also distinguishes
    active, reactive and apparent power.'
  source: Troncia et al. (2023), §2.4 / OneNet D11.2 Fig. 5.5
- term: Continuous clearing
  definition: A market arrangement in which participants can buy or sell while the market is open.
  source: Troncia et al. (2023), §2.4
- term: Discrete clearing
  definition: A recurring scheduled batch-clearing arrangement in which the market is cleared at discrete intervals.
  source: Troncia et al. (2023), §2.4
- term: Procurement frequency
  definition: How often the sub-market is run. This is distinct from the gate timing/GCT of the individual market session.
  source: Troncia et al. (2023), §2.4
- term: Bid properties
  definition: An additional D11.2 market-operation feature describing the nature of accepted bids through minimum bid size
    and bid structure.
  source: OneNet D11.2, §5.1.4
- term: Minimum bid size
  definition: The minimum volume of capacity or energy that a bid must contain in the market.
  source: OneNet D11.2, Table 2.1
- term: Bid structure
  definition: The level of complexity permitted in a bid; the TMF distinguishes simple and complex structures at high level.
  source: OneNet D11.2, Table 2.1 / Fig. 5.5
