hero:
  eyebrow: Flexible access under constrained network capacity
  title: Flexible connection agreement
  philosophy: A flexible connection turns scarce network capacity into explicit, reviewable
    conditions for access, curtailment and responsibility.
  lead: Use the four pillars to describe why flexible access is offered, what the
    contract contains, how curtailment operates, and how risks and value are allocated.
  primary_button: Explore the four pillars
  secondary_button: How to review
sections:
  overview:
    eyebrow: Overview and orientation
    title: Flexible access is a connection right with conditions
    text: A flexible connection allows electrical capacity to connect while injection
      or withdrawal can be limited or controlled under agreed conditions. The arrangement
      therefore combines a firm part of the connection with clearly defined flexible
      access conditions, so the user can understand what capacity is guaranteed and
      what capacity may be restricted.
  idea:
    eyebrow: What is the proposal?
    title: Describe every flexible connection through the same four design pillars
    text: The four-pillar structure turns a broad non-firm connection concept into
      comparable design choices. It separates the reason and eligibility for the offer,
      the contractual envelope, the operational curtailment process, and the economic
      consequences so that different schemes can be described with the same language.
  why:
    eyebrow: Why does it matter?
    title: Faster connection is valuable only when the conditions are transparent
      and workable
    text: Flexible connections can accelerate grid access, make better use of scarce
      hosting capacity, and avoid or defer reinforcement when that is efficient. Their
      value depends on transparent curtailment rules, predictable limits, a clear
      pathway to firm access where relevant, and coordination with tariffs and flexibility
      markets so that risks and incentives are not shifted unfairly.
  who:
    eyebrow: Who is affected?
    title: The agreement links system operation, regulation and the connected user
    text: The connected system user and the system operator are the core parties,
      but the design also affects regulators or competent authorities, balance-responsible
      parties, aggregators and other market actors. Their responsibilities become
      especially important when curtailment changes schedules, market positions, network
      charges or imbalance exposure.
    where_title: Areas with limited or unavailable network capacity
    where_text: Flexible connections are most relevant where requested firm capacity
      cannot be offered immediately because network capacity is limited or unavailable.
      They may be temporary while reinforcement is delivered, or remain permanent
      where network development is not the most efficient solution. Depending on the
      framework, generation, demand and storage can all be eligible.
  framework:
    eyebrow: Shared review structure
    title: Four pillars for describing flexible connection agreements
    text: Each pillar captures a different design layer. Review the definitions first,
      then answer the pillar questionnaire and open the GitHub discussion.
