eyebrow: The structure of exchange
title: Market architecture
subtitle: 'The Entire Market Architecture pillar fixes the high-level structure of the market: the sub-markets that exist,
  their timing and type, the services and products exchanged, where procurement is located, and the roles of the actors involved.'
philosophy: 'The TMF treats market architecture as a system of interacting sub-markets rather than as one undifferentiated
  marketplace. The architecture pillar therefore answers the first design question: what are the exchange spaces that exist,
  and what must be specified for each of them before coordination and clearing can be analysed? OneNet D11.2 updates this
  pillar with more explicit timing, product and participant descriptors so that different demonstrators can be described with
  the same vocabulary.'
flowchart_caption: The flowchart is the source TMF taxonomy for the Entire Market Architecture pillar. Read it from the high-level
  sub-market structure toward service/product, location and actor choices.
tutorial_intro: 'Use this pillar first: it establishes the market-design objects that every later pillar must coordinate,
  clear, operate, and constrain. OneNet D11.2 treats it as the high-level description of the architecture as a whole and extends
  the earlier TMF with more explicit timing, product, and participant descriptors.'
tutorial_sections:
- title: 1. Establish the sub-market landscape
  text: Identify how many sub-markets form the architecture and record the timing and market type of each one. D11.2 adds
    Gate Opening Time (GOT), Gate Closure Time (GCT) and Market Time Unit (MTU) to make the temporal dimension explicit.
  items:
  - Number of sub-markets.
  - GOT, GCT and MTU for each sub-market.
  - 'Sub-market type: bilateral negotiation, auction or exchange market.'
- title: 2. Separate service from product
  text: The TMF distinguishes the system need from the tradable unit used to procure flexibility. This separation is essential
    when one product can serve more than one system need or when similar services are procured through different products.
  items:
  - 'Service: the system need/action to be delivered.'
  - 'Product: the tradable unit acquired from flexibility providers.'
  - Type of product and technical requirements, added explicitly in D11.2.
- title: 3. Locate procurement in the grid
  text: For each sub-market, describe the locational granularity, the responsible system operator and the voltage level of
    participating resources. The framework makes location part of market design rather than an implementation afterthought.
  items:
  - Area, feeder or node granularity at transmission or distribution level.
  - 'Responsible SO: TSO or DSO.'
  - Voltage level of the resources.
- title: 4. Make actor roles and participation explicit
  text: Record who buys, who sells and who operates the market, together with technology eligibility, aggregation and participation
    rules. D11.2 expands this part with allowed technologies, aggregation method and aggregation mix.
  items:
  - Buyer(s), seller(s) and market operator.
  - Allowed generation, load and storage technologies.
  - Aggregation method and aggregation mix.
  - Optional, compulsory or hybrid participation.
- title: 5. Use the pillar as a design-intelligence check
  text: The OneNet analysis shows that temporal and spatial choices affect liquidity and competition, while product harmonisation
    can improve interoperability but may conflict with local technical needs. Actor boundaries must also be clear to avoid
    conflicts when products become interoperable across markets.
  items:
  - Ask whether the market window and procurement area are too narrow for liquidity.
  - Check whether product harmonisation improves interoperability without losing necessary local specificity.
  - Check that responsibilities remain unambiguous when the same resources can participate in several markets.
- title: 6. Continue through the TMF workflow
  text: 'The 2023 paper applies the TMF bottom-up: identify buyer-seller interactions, define the sub-markets, describe each
    sub-market, describe interactions between sub-markets, then assemble the high-level market architecture. This pillar carries
    the first three steps.'
  items: []
terminology_intro: The definitions below preserve the terminology used by OneNet D11.2 and the Troncia et al. TMF paper. Where
  D11.2 extends the earlier framework, that update is stated explicitly.
terminology:
- term: Market architecture
  definition: The whole mechanism through which electricity products are exchanged to operate a delimited power system. In
    the TMF it is represented as interacting sub-markets.
  source: Troncia et al. (2023), §2
- term: Sub-market
  definition: A market operated by one market operator that is responsible for clearing that specific market according to
    a specific objective.
  source: Troncia et al. (2023), §2
- term: Gate Opening Time (GOT)
  definition: The TMF temporal sub-feature used to record when a sub-market gate opens. D11.2 adds GOT, together with GCT
    and MTU, to improve the description of the market architecture time dimension.
  source: OneNet D11.2, §5.1.1 / Fig. 5.2
- term: Gate Closure Time (GCT)
  definition: The TMF temporal sub-feature used to record when a sub-market gate closes. In D11.2 it is a key compatibility
    variable when analysing how local and central markets can interact or forward bids.
  source: OneNet D11.2, Table 2.1
- term: Market Time Unit (MTU)
  definition: The time granularity of the market interval/product recorded for a sub-market. D11.2 demonstrator comparisons
    use MTU values such as 15 minutes and 1 hour and identify MTU mismatches as a potential barrier to bid forwarding.
  source: OneNet D11.2, Table 2.1
- term: Sub-market type
  definition: The market-based solution used to acquire flexibility, such as bilateral negotiation, auction or exchange market.
  source: Troncia et al. (2023), §2.1 / OneNet D11.2 Fig. 5.2
- term: Service
  definition: The action generally undertaken by the system operator to mitigate a technical scarcity that would otherwise
    undermine network operation or create stability risks.
  source: Troncia et al. (2023), §2.1
- term: Product
  definition: The tradable unit acquired by the network operator from flexibility providers that gives the option to deliver
    a service when activated.
  source: Troncia et al. (2023), §2.1
- term: Type of product
  definition: An explicit D11.2 Product(s) sub-feature that records the form of the exchanged product. D11.2 derives its options
    from electricity-market product lists and uses it to compare compatibility across markets.
  source: OneNet D11.2, §5.1.1 / Table 2.1
- term: Technical requirements
  definition: All technical properties that define the product based on the system service for which it is procured; D11.2
    gives ramping as an example of such a property.
  source: OneNet D11.2, §5.1.1 / Table 2.1
- term: Locational granularity
  definition: The level of detail used to represent the location of a buying or selling unit; TMF options include areas, feeders
    and nodes at transmission or distribution level.
  source: OneNet D11.2, Table 2.1 / Fig. 5.2
- term: Responsible System Operator (SO)
  definition: The actor taking the system-operator role for the sub-market; the TMF records whether that responsibility lies
    with a TSO or DSO.
  source: Troncia et al. (2023), §2.1 / OneNet D11.2 Fig. 5.2
- term: Market Operator (MO)
  definition: The actor responsible for operation/clearing of the sub-market. The TMF distinguishes TSO, DSO or an independent
    market operator as possible market-operator arrangements.
  source: Troncia et al. (2023), §2 / OneNet D11.2 Fig. 5.2
- term: Flexibility/Service Provider (FSP/SP)
  definition: The selling side that provides eligible flexibility or system-service capability, individually or through aggregation.
  source: OneNet D11.2, Fig. 5.2 and demonstrator tables
- term: Allowed technologies
  definition: The D11.2 market-participant sub-feature that states which resource classes are eligible; Figure 5.2 explicitly
    lists generators, loads and storage.
  source: OneNet D11.2, Table 2.1
- term: Aggregation method
  definition: The D11.2 sub-feature that records how resources may be aggregated. Figure 5.2 lists none, area, voltage level,
    substation, other, and not applicable as high-level options.
  source: OneNet D11.2, Fig. 5.2
- term: Aggregation mix allowed
  definition: The D11.2 sub-feature that records what types of resources/bids may be combined inside an aggregation; Figure
    5.2 lists technology-based, bid-based and other as high-level options.
  source: OneNet D11.2, Fig. 5.2
- term: Participation in sub-market
  definition: Optional means providers may choose to participate; compulsory means certain parties are obliged to participate
    under defined circumstances; hybrid combines compulsory and optional participation.
  source: Troncia et al. (2023), §2.1
