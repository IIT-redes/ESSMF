eyebrow: Flexible connection agreement · Pillar 4
title: Economic arrangements
subtitle: How is curtailed energy valued and compensated?
color: '#18865B'
image: ../assets/connection-f6.webp
philosophy: 'This pillar allocates the economic consequences of curtailment: compensation,
  alternative value streams, consequences of non-compliance and responsibility for
  imbalances.'
tutorial_intro: Review the economic layer together with tariffs and local markets
  so that the same flexibility is not unintentionally charged or rewarded twice.
tutorial_sections:
- title: 1. Define curtailment compensation
  text: State whether compensation exists and how its value is determined.
- title: 2. Define permitted value stacking
  text: Record whether energy affected by curtailment may be traded through bilateral
    contracts, local flexibility markets or other channels.
- title: 3. Allocate non-compliance and imbalance risk
  text: State consequences for exceeding limits and identify who carries imbalance
    responsibility when curtailment changes schedules.
table_intro: Use this pillar to make the financial risk allocation explicit and to
  expose potential double charging, double compensation or conflicting market obligations.
